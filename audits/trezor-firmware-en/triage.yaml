# Recovered from trezor-firmware-en/report.json, which is where these decisions were signed.
# Written back so a re-audit keeps them instead of discarding them.
analyst: "QSI review, 2026-10-28"
decisions:
  - match: {rule: "CODE-QV-ASYMMETRIC", title: "role not determined", algorithm: "ECDH"}
    decision: confirmed
    note: "Role resolved. crypto/bip32.c:702 is inside hdnode_get_shared_key: it calls curve25519_scalarmult(session_key + 1, node->private_key, peer_public_key + 1) and returns \"ECDH is not supported\" for any other curve. So this is ECDH between a BIP-32 node's private key and a peer public key, producing a session key for the identity and encryption features (SLIP-0017 style), not for spending. Harvest-now-decrypt-later applies to anything wrapped under such a session key, and because the node keys are derived from the device seed, a CRQC that recovers one node's private key recovers every session that node ever established. Priority: below transaction signing, above attestation."
  - match: {rule: "CODE-QV-ASYMMETRIC", title: "role not determined", algorithm: "X25519"}
    decision: confirmed
    note: "Role resolved. crypto/bip32.c:485 is inside hdnode_fill_public_key, which dispatches per curve: ed25519_publickey, ed25519_publickey_sha3, ed25519_publickey_keccak, curve25519_scalarmult_basepoint and the Cardano variant. The remaining anchors are crypto/ed25519-donna/ed25519.{c,h}, the vendored implementation. So these rows are the public-key derivation layer feeding the signing and ECDH paths that are inventoried separately, not an independent use. They belong in the inventory because the derivation itself has to change in a post-quantum scheme, but a reader should not count them as extra exposure on top of the signing rows."
  - match: {rule: "CODE-QV-ASYMMETRIC", title: "role not determined", algorithm: "Ed25519"}
    decision: confirmed
    note: "Role resolved. All four anchors are the vendored ed25519-donna implementation, including its keccak and sha3 variants (crypto/ed25519-donna/ed25519-keccak.h, ed25519-sha3.h, ed25519.c, ed25519.h), which the NEM and Monero paths select through hdnode_fill_public_key. This is the Ed25519 implementation itself: the thing a migration replaces, reached by the transaction-signing rows already counted."
  - match: {rule: "CODE-QV-ASYMMETRIC", title: "role not determined", algorithm: "ECDSA"}
    decision: confirmed
    note: "Role resolved, and the anchor set is mixed, which matters for scoping. crypto/curves.c, crypto/ecdsa.c and crypto/ecdsa.h are the ECDSA implementation the device signs with — the correct and highest-priority inventory rows. But two of the eight files are not firmware: crypto/setup.py is the build script for the Python bindings, and crypto/tools/bip39bruteforce.c is a standalone demonstration utility. Neither ships on the device, so a migration plan should carry the three implementation files and drop those two. Flagging this rather than dismissing the whole finding: the rule is right, its file list is broader than the deployed surface."
  - match: {rule: "CODE-QV-ASYMMETRIC", title: "authentication and identity", algorithm: "ECDSA"}
    decision: confirmed
    note: "Correct and worth separating from transaction signing. The anchors are core/embed/sec/optiga/ optiga_commands.c:1055 and optiga/unix/optiga.c — the Infineon OPTIGA secure element, which the device uses for device attestation and pairing rather than for spending. Short-lived authentication survives until a CRQC exists; a device identity that outlives the hardware does not, so this is a replace-at-next-hardware- revision item, not a firmware-update item."
  - match: {rule: "CHAINMAP-QV"}
    decision: confirmed
    note: "True by construction and the most important row in the report for planning. The protobuf message definitions in common/protob cover 11 chains whose signature schemes are fixed by consensus, not by the wallet: Bitcoin, Cardano, EOS, Ethereum and EVM, Monero, NEM, Solana, Stellar, Tezos, Tron, XRP. The wallet cannot migrate any of them unilaterally, so the deliverable here is a readiness map, not a code change — which is exactly why this belongs in an inventory rather than a vulnerability list."
  - match: {rule: "CODE-QV-ASYMMETRIC"}
    decision: confirmed
    note: "The remaining rows carry a role the engine determined and review agrees with, each checked against the cited file. Ed25519 at core/embed/sec/image/boot_header.c:81 and image.c is firmware and boot verification, with the public keys fixed in the bootloader. **It must not be called unmigrated, because this vendor has already started**: SLH-DSA appears in that same boot_header.c at line 30, there is a whole ML-DSA-44 module at core/embed/sec/mldsa44/, MCU attestation uses ML-DSA (core/embed/sec/mcu_attestation/), and the tree ships an X.509 certificate with an ML-DSA-44 public key (core/embed/sec/secret/unix/certs/T3W1.der). The inventory carries those seven rows as post-quantum. So the correct reading of this repository is a root of trust **mid-transition**, carrying both schemes, and the Ed25519 rows are what remains of the classical half rather than evidence that nothing has been done. Trezor is the most advanced repository in this portfolio on post-quantum readiness, and any report that presents it otherwise is wrong on a point its own engineers would see immediately. X25519 at core/embed/sec/tropic/tropic.c:383 plus crypto/noise_kk1.c and noise_xxpsk3.c is channel key exchange with the Tropic01 secure element over Noise — recordable now, decryptable later, and the standard answer is a hybrid exchange. ECDSA at crypto/bip32.c:40, crypto/secp256k1.c and crypto/zkp_bip340.c, and Schnorr (BIP-340) at crypto/zkp_bip340.c:139, are transaction signing. Ed25519 at crypto/bip32.c:477, crypto/nem.c and nem.h is transaction signing on the NEM path."
