# Recovered from bitbox02-firmware/report.json, which is where these decisions were signed.
# Written back so a re-audit keeps them instead of discarding them.
analyst: "QSI review, 2026-10-28"
decisions:
  - match: {rule: "DEP-ADVISORY-UNRATED", advisory: "RUSTSEC-2026-0387"}
    decision: confirmed
    note: "crypto-bigint 0.5.5 (multiple timing variability issues in operations intended to be constant-time) is reachable in shipped firmware, and the path is worth stating exactly because it is narrower than it looks. src/rust/util/Cargo.toml:17 takes p256 as an *optional* dependency with features [\"arithmetic\", \"ecdsa\"], and lib.rs guards it with #[cfg(feature = \"p256\")]. That feature is switched on in exactly one place: src/rust/bitbox02-rust-c/Cargo.toml, inside the app-u2f feature block (\"util/p256\"). So p256 -> elliptic-curve -> crypto-bigint is compiled in whenever the U2F/FIDO app is built — the Multi edition — and is absent from a Bitcoin-only build. What it does there is secret-dependent: util/src/p256.rs exports rust_p256_sign, which calls SigningKey::sign_prehash with a private key over the C FFI, i.e. U2F authentication signatures on NIST P-256. The keys at stake are therefore FIDO credentials, NOT bitcoin spending keys: those go through bitbox-secp256k1 (libsecp256k1 in C), which this advisory does not touch. Stated precisely: no exploit is demonstrated, and the attacker model is physical possession plus timing measurement, which is the threat a hardware wallet exists to resist — hence medium rather than low. Fix available in crypto-bigint 0.7.6; maintainers should match the advisory's named operations against p256's scalar arithmetic."
  - match: {rule: "DEP-KNOWN-ADVISORY", advisory: "GHSA-qwgh-2vcv-g2f7"}
    decision: not_applicable
    note: "block-buffer 0.10.3 reaches this tree through digest, so every hash in it (sha2, sha3, blake2, hmac, ripemd, the dalek curves) sits above it and the dependency really is there. But the advisory is that a panic leaves the inline buffer position corrupted, which only matters if the panic is caught and the same buffer is then reused. This is no_std firmware on Cortex-M: std::panic::catch_unwind does not exist in that build. Checked rather than assumed — of 30 catch_unwind occurrences in the repository, 26 are in external/vendor third-party crates and the 4 under src/ are all test code: a #[cfg(test)] mod in bitbox-executor/src/lib.rs, two TestingHal tests in bitbox02-rust/src/hww.rs and async_usb.rs, and the integration test bitbox-secp256k1/tests/context.rs. The precondition cannot occur on the device."
  - match: {rule: "DEP-ADVISORY-UNRATED", advisory: "RUSTSEC-2026-0190"}
    decision: not_applicable
    note: "anyhow 1.0.31 (unsoundness in Error::downcast_mut) enters only through prost-derive, which is a proc-macro crate, so it runs in the code generator at build time and is never linked into the firmware image. Traced in src/rust/Cargo.lock: anyhow <- prost-derive <- prost <- bitbox-proto <- bitbox02-rust <- bitbox02-rust-c. Error::downcast_mut is not called anywhere in the audited tree."
  - match: {rule: "DEP-KNOWN-ADVISORY", advisory: "GHSA-3288-p39f-rqpv"}
    decision: not_applicable
    note: "keccak 0.1.4's unsoundness is in the opt-in ARMv8 assembly backend behind the asm Cargo feature, which is off by default and which no manifest in src/rust enables. Its consumers are bitbox02-rust and sha3, both using the portable implementation. Upgrading to 0.1.6 is still the cheap move during routine maintenance."
  - match: {rule: "DEP-KNOWN-ADVISORY", advisory: "RUSTSEC-2026-0009"}
    decision: not_applicable
    note: "time 0.3.44's stack-exhaustion issue is in the RFC 2822 and RFC 3339 parsing entry points (time::Date::parse, time::OffsetDateTime::parse and friends). time is pulled in by the workspace's own util crate, which uses it for datetime formatting in util/src/datetime.rs, not for parsing attacker-supplied strings, and no audited file names the affected functions."
  - match: {rule: "DEP-ADVISORY-INFORMATIONAL", advisory: "RUSTSEC-2026-0110"}
    decision: not_applicable
    note: "bare-metal 0.2.5 is flagged as deprecated, not vulnerable; the advisory reports no defect. Recording the decision to keep it, which is what an informational advisory asks for. It is relevant to post-quantum readiness only in the weak sense that an unmaintained crate will not gain PQ support, and this one carries no cryptography at all."
  - match: {rule: "CODE-QV-ASYMMETRIC", title: "role not determined", algorithm: "ECDSA"}
    decision: confirmed
    note: "Role resolved for all six files, and they are three different roles rather than one. src/pukcc/pukcc.c:181 is pukcc_ecdsa_verify, the ATSAM PUKCC hardware public-key controller performing ECDSA *verification* — the bootloader's signature check, so a root-of-trust item, and verification uses public keys only, which puts it outside any timing concern. src/rust/streaming-silent-payments/{lib,hash}.rs is BIP-352 silent payments, i.e. address derivation on secp256k1. src/rust/util/src/p256.rs is the U2F/FIDO P-256 signing described in the crypto-bigint decision above. Each has a different migration deadline, which is why leaving them merged as \"role not determined\" would be the wrong input to a plan."
  - match: {rule: "CODE-QV-ASYMMETRIC", title: "role not determined", algorithm: "Ed25519"}
    decision: confirmed
    note: "Role resolved: the single anchor is src/rust/bitbox02-rust/src/hww/api/bitboxsync.rs:11, the same file that carries the X25519 at-rest row. BitBoxSync wraps synchronised data to a recipient public key, so this is key wrapping and encryption at rest, and harvest-now-decrypt-later applies: anything copied today is readable once a CRQC exists. Highest-urgency class in this repository, because unlike signing it cannot be fixed retroactively."
  - match: {rule: "CHAINMAP-QV"}
    decision: confirmed
    note: "True by construction. messages/btc.proto, cardano.proto and eth.proto define the supported chains, whose signature schemes are set by consensus rather than by the wallet. The wallet cannot migrate them unilaterally, so this is a readiness map rather than a defect."
  - match: {rule: "CODE-QV-ASYMMETRIC"}
    decision: confirmed
    note: "The remaining rows carry roles the engine determined and review agrees with, each checked against the cited file. ECDSA at src/bootloader/bootloader.c:537 and stage0/stage1_sigcheck.c is firmware and boot verification, with the public keys fixed in the bootloader: the hardest item to migrate, because it needs new hardware or a signed transition path. X25519 at bitbox-noise/{lib,noise_xx,x25519}.rs is the Noise channel to the host — recordable now, decryptable later, answered by a hybrid exchange. X25519 at bitboxsync.rs is key wrapping at rest. ECDSA across bitbox-secp256k1 and bitbox02-rust (bip32.rs, bip39.rs, hww/api/bitcoin/signmsg.rs) is transaction and message signing on secp256k1. Ed25519 at bitbox02-rust/src/keystore/ed25519.rs is transaction signing on the Cardano path."
  - match: {rule: "DEP-NO-PQC-LIBRARY"}
    decision: confirmed
    note: "Accurate and the single most quotable row for a migration budget: across 40 dependency manifests the tree declares curve25519-dalek, ecdsa, ed25519-dalek, p256, secp256k1 and x25519-dalek, and nothing PQC-capable. On a Cortex-M target that is not an oversight — ML-DSA and SLH-DSA signature and key sizes are the constraint, and a no_std PQ implementation that fits the flash and RAM budget is itself the engineering problem. Worth stating as a finding precisely because the fix is not \"add a crate\"."
