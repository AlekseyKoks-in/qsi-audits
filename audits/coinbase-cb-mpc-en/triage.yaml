# Recovered from coinbase-cb-mpc-en/report.json, which is where these decisions were signed.
# Written back so a re-audit keeps them instead of discarding them.
analyst: "QSI review, 2026-10-28"
decisions:
  - match: {rule: "CODE-QV-ASYMMETRIC", algorithm: "ECDH"}
    decision: confirmed
    note: "The highest-urgency class in this repository, and it is not signing. The anchors are the publicly verifiable encryption paths — include-internal/cbmpc/internal/protocol/pve_base.h:213 calls prv_key.ecdh(...) and checks a 32-byte output, and src/cbmpc/api/{pve_base_pke,pve_batch_ac, pve_batch_single_recipient}.cpp plus pve_internal.h:154 all guard on \"missing HSM ECIES ECDH callback\". PVE is how key shares are encrypted to a recipient for backup and escrow, so the ciphertexts are stored. Harvest-now-decrypt-later applies in full: a copy taken today of an encrypted share set becomes plaintext once a CRQC exists, and no later migration undoes that. Unlike a signature scheme, this can be fixed today by wrapping the share under a hybrid KEM, which makes it the first thing to do rather than the hardest — and nearer than it looks, because this repository already implements ML-KEM-768 without the PVE path using it. See the DEP-NO-PQC-LIBRARY decision below."
  - match: {rule: "CODE-QV-ASYMMETRIC", algorithm: "Paillier"}
    decision: confirmed
    note: "Correct, with a parameter worth quoting: include-internal/cbmpc/internal/crypto/base_paillier.h declares class paillier_t with static constexpr int bit_size = 2048, so the modulus is 2048 bits and Shor's algorithm faces exactly the problem it faces for RSA-2048. The evidence is real implementation rather than a name match — base_paillier.h, zk/zk_paillier.h's valid_paillier_t, and the key structures in protocol/ecdsa_2p.h and hd_keyset_ecdsa_2p.h, which each hold a crypto::paillier_t and its c_key. This is the row that a post-quantum *signature* standard does not help with: Paillier is the homomorphic encryption the two-party ECDSA protocol is built on, so replacing it is a protocol redesign, and NIST's 2024 standards (ML-DSA, SLH-DSA) are single-signer schemes that do not offer a drop-in replacement."
  - match: {rule: "CODE-QV-ASYMMETRIC", algorithm: "Pedersen commitment"}
    decision: confirmed
    note: "Correct and anchored on real parameter generation, not a mention: src/cbmpc/zk/zk_pedersen.cpp constructs pedersen_commitment_params_t with primes generated via BN_generate_prime_ex (the comment names the OpenSSL function), zk_pedersen.h:13 exposes get() and check_safe_prime_subgroup, and both src/cbmpc/protocol/ecdsa_2p.cpp:28 and src/cbmpc/zk/zk_paillier.cpp:537 pull those parameters. Stated precisely, because the distinction decides how bad this is: breaking the discrete log costs a Pedersen commitment its *binding* property, not its hiding — the commitment is perfectly hiding, so no committed value is recoverable from it even with a CRQC. The exposure is forgeability inside the proofs, i.e. future protocol soundness, not retroactive disclosure."
  - match: {rule: "CODE-QV-ASYMMETRIC", algorithm: "Threshold ECDSA"}
    decision: confirmed
    note: "The claim is right — cb-mpc is a threshold ECDSA library and these 13 files are its protocol surface (api/ecdsa_2p.h, api/ecdsa_mp.h, internal/protocol/ecdsa_2p.h, ecdsa_mp.h, hd_keyset_ecdsa_2p.h) — but the cited evidence is weaker than the claim and a reader should know which is which. Most anchors are namespace declarations and their closing braces (namespace coinbase::api::ecdsa_2p, coinbase::mpc::ecdsampc), so the row follows from the library's purpose rather than from the quoted line. The substantive evidence for this class is in the Paillier and Pedersen rows above, which cite implementations. Confirmed on that basis, and the detector would serve better by anchoring on the protocol functions."
  - match: {rule: "CODE-QV-ASYMMETRIC", algorithm: "Ed25519"}
    decision: confirmed
    note: "Threshold EdDSA, which the library implements alongside threshold ECDSA: api/eddsa_2p.h, internal/protocol/eddsa.h (which includes schnorr_mp.h), hd_keyset_eddsa_2p.h and src/cbmpc/api/eddsa2pc.cpp, where blob_to_key validates the key blob role. Same conclusion as threshold ECDSA and the same caveat about namespace anchors; the protocol is a Schnorr-style multiparty scheme over Ed25519, so Shor breaks both the signature and the discrete-log proofs around it."
  - match: {rule: "CODE-QV-ASYMMETRIC", algorithm: "ECDSA"}
    decision: confirmed
    note: "Plain (non-threshold) ECDSA on secp256k1 inside the Schnorr two-party API: src/cbmpc/api/schnorr2pc.cpp:31 and :48 validate and write blob.curve against curve_id::secp256k1 and serialise key.Q compressed. Key-blob handling for the signing keys, so the same migration item as the threshold rows; counted separately because it is the serialisation format, which is where a migration needs a version bump."
  - match: {rule: "CODE-QV-ASYMMETRIC", algorithm: "RSA"}
    decision: confirmed
    note: "Role resolved. src/cbmpc/crypto/base_rsa.cpp implements rsa_pub_key_t with encrypt_raw (deliberately RSA_NO_PADDING, because it is a primitive for a higher-level scheme rather than a general-purpose encryption API), verify_pkcs1, and EVP_RSA_gen(bits) for generation. It is included by internal/crypto/base_pki.h and internal/crypto/base_paillier.h and exercised by tests/unit/api/test_pve.cpp, so this is the PKI layer underneath publicly verifiable encryption and the modulus arithmetic that Paillier is built on. Same quantum exposure as the Paillier row, for the same reason: Shor factors the composite modulus. Because PVE ciphertexts are stored, this inherits the harvest-now-decrypt-later urgency of the ECDH row rather than the lower urgency of a signing path."
  - match: {rule: "DEP-NO-PQC-LIBRARY"}
    decision: confirmed
    note: "Accurate as written — the rule is about *declared dependency manifests*, and cb-mpc declares no PQC-capable library — but it would mislead a reader on its own, so the rest belongs here. The source tree already implements ML-KEM-768 itself: include-internal/cbmpc/internal/crypto/mlkem768.h and src/cbmpc/crypto/mlkem768.cpp define mlkem768_pub_key_t and mlkem768_prv_key_t with encapsulate and decapsulate, and the inventory carries both rows as post-quantum. What it is not is wired up: the only files that include it are its own .cpp, src/cbmpc/crypto/CMakeLists.txt and tests/unit/crypto/test_mlkem768.cpp. Nothing in the PVE or PKI path reaches it. So the accurate statement is the useful one: the KEM this library needs for its harvest-now-decrypt-later exposure is already built and not yet connected to it — a wiring job rather than a research problem. Separately, and still true: no standardised post-quantum *threshold signature* exists to depend on (NIST's 2024 standards are single-signer, the multi-party threshold effort is at the call stage, and the literature notes PQC-round schemes do not convert directly to threshold form through MPC), so the signing side of this library is the part that cannot be closed today."
