# Recovered from trezor-vendored-crypto/report.json, which is where these decisions were signed.
# Written back so a re-audit keeps them instead of discarding them.
analyst: "QSI review, 2026-10-29"
decisions:
  - match: {algorithm: "SLH-DSA"}
    decision: confirmed
    note: "Correct, and the count needs reading carefully rather than quoting. 94 rows is one per file of the *complete* upstream SPHINCS+ reference implementation, which this submodule is: four backends — ref/, haraka-aesni/, sha2-avx2/, shake-a64/, shake-avx2/ — and 18 parameter-set headers under ref/params/. A Trezor's microcontroller cannot execute the AVX2 or AArch64 SIMD code at all, and the build compiles exactly one parameter set, so the honest statement about the device is not \"94 implementations of SLH-DSA\" but \"Trezor pins the whole SPHINCS+ reference implementation and compiles one configuration from it\" — which is much stronger evidence of real migration work than an imported header, and is where the main audit's boot_header.c:30 call site leads. 17 of the 94 rows are the Haraka instantiation, which FIPS 205 did *not* standardise (it covers the SHA2 and SHAKE instantiations), so those rows are pre-standard SPHINCS+ rather than SLH-DSA proper; they are upstream's and say nothing about what Trezor selected. Kept at the detector's medium confidence. This is also the finding that proves the detector was wrong before today: the previous run read these same 123 files and reported zero SLH-DSA rows, because the reference implementation calls itself SPX_* and spx_ctx and never writes the standard's name."
  - match: {rule: "CODE-QV-ASYMMETRIC", algorithm: "ECDSA"}
    decision: confirmed
    note: "Correct: 21 files of vendor/secp256k1-zkp (24 as first published; three were its benchmark harness, which the runner sets aside since 2026-10-29), Blockstream's fork of libsecp256k1, which is what a Trezor actually signs Bitcoin transactions with. The main audit's 73 Shor-breakable rows count the call sites in core/embed/sec; these are the implementation under them. The two should be read together and not added together — it is one dependency measured at two levels, which is why this bundle is not folded into the portfolio's per-codebase counts."
  - match: {rule: "CODE-QV-ASYMMETRIC", algorithm: "Schnorr (BIP-340)"}
    decision: confirmed
    note: "Correct, three files (four as first published; the fourth was the module's own benchmark), the schnorrsig module of the same vendored library: Taproot spends."
  - match: {rule: "CODE-QV-ASYMMETRIC", algorithm: "Ed25519"}
    decision: confirmed
    note: "Correct and directly relevant to the migration story rather than to spending. Ed25519 is what the device's boot header is signed with today — core/embed/sec/image/boot_header.c:81 in the main audit — and these five rows are its implementation. This is the primitive SLH-DSA is being added alongside, so the pair Ed25519-plus-SLH-DSA in one header is the whole point: the root of trust is mid-migration, carrying both. Firmware signatures are forward-only exposure, but the consequence of a forgery is arbitrary code on a device holding keys, which is why a signer's boot path is where post-quantum signatures matter first even though the spending path is the louder number."
  - match: {rule: "CODE-QV-ASYMMETRIC", algorithm: "ECDH"}
    decision: confirmed
    note: "The vendored secp256k1-zkp does carry ECDH key agreement (src/modules/ecdh), and it is the only retroactive exposure here: where a shared secret derived through it protects anything stored or recorded, a copy taken today becomes readable once a CRQC exists, and unlike the signature rows it can be hardened without a consensus change, by wrapping the agreed secret under a hybrid KEM. But the one ECDH row first published here came from a printf in the library's benchmark harness, not from that module, and the runner sets benchmarks aside since 2026-10-29; the module itself is not yet recognised, because the registry has no pattern for secp256k1_ecdh — a vocabulary gap found on 2026-11-02 and recorded for the next registry change. Until then this decision matches no finding."
