# Recovered from krux/report.json, which is where these decisions were signed.
# Written back so a re-audit keeps them instead of discarding them.
analyst: "QSI review, 2026-10-29"
decisions:
  - match: {rule: "CODE-ECB-MODE", asset: "*krux_settings.py*"}
    decision: not_applicable
    note: "Not a use of the mode. src/krux/krux_settings.py:425 defines MODE_NAMES = {ucryptolib.MODE_ECB: \"AES-ECB\", ...}, a mapping from mode constant to the label shown in the settings menu, so the device can print which format a user picked. No key, no plaintext and no call to ucryptolib.aes appears here. The design decision this finding is really about is in src/krux/kef.py and is decided separately below; counting it twice would report one choice as two problems."
  - match: {rule: "CODE-ECB-MODE", asset: "*kef.py*"}
    decision: confirmed
    note: "Real and deliberate: src/krux/kef.py defines the Krux Encrypted Format, and of its eleven versions four are ECB — version 0 \"AES-ECB v1\" (released 2023.08 for BIP-39 entropy), 5 \"AES-ECB\", 6 \"AES-ECB +p\" and 7 \"AES-ECB +c\". So a user can store an encrypted mnemonic under ECB, and old backups already are. Reported at medium rather than high, because the usual reasons for calling ECB high do not all hold here and saying so is the point of a review. Every version carries an `auth` field sizing an authentication tag, so integrity is not left to the mode; GCM versions 20 and 21 exist in the same table; and the maintainers document the actual hazard themselves, version 6 reading \"safe padding: for mid-sized plaintext w/o duplicate blocks\" and 7 \"may compact otherwise duplicate blocks\". For the intended payload — one or two blocks of high-entropy mnemonic — ECB's block-repetition leak has little to bite on. What remains true, and is the actionable half: versions 6 and 7 exist precisely for larger plaintext, which is where duplicate blocks become possible, and ECB there leaks structure that CTR or GCM would not. The recommendation is not \"remove ECB\" (that would orphan 2023 backups) but to keep the ECB versions for decryption of old backups and stop offering them for new ones."
  - match: {rule: "CODE-WEAK-PBKDF2", asset: "*slip39.py*"}
    decision: not_applicable
    note: "The iteration count is a protocol constant, not a hardening parameter. vendor/embit/src/embit/slip39.py:51 calls hashlib.pbkdf2_hmac(\"sha256\", i + passphrase, salt + right, 2500 << exponent, half) inside _crypt, which is SLIP-39's four-round Feistel construction: 2500 per round times four rounds is the specification's base iteration count of 10000, and `exponent` is SLIP-39's own iteration-exponent field, which a share carries so that any implementation can reproduce it. Raising it to OWASP's 600,000 — the rule's recommendation, which is correct guidance for password storage — would produce shares that no other SLIP-39 implementation could read, and would therefore destroy the interoperability that makes a backup standard worth using. The rule is right that 2500 is low for a password; it is the wrong question for a protocol constant. Worth separating from a real concern: SLIP-39's security rests on the share secret, not on the passphrase being hard to guess, so the iteration count is not what protects a strong share."
  - match: {rule: "CODE-QV-ASYMMETRIC", algorithm: "ECDSA"}
    decision: confirmed
    note: "Correct, and this is the finding the audit exists to produce. 43 of the 87 inventory rows are ECDSA (53 of 98 as first published on 2026-10-29, before eleven benchmark files of the vendored secp256k1-zkp were set aside) and they span the whole chain: src/krux/key.py:255 calls secp256k1.ecdsa_sign_recoverable through embit, which dispatches in vendor/embit/src/embit/util/secp256k1.py either to ctypes_secp256k1.py (the C library) or to py_secp256k1.py (a pure-Python fallback), and the C library itself is vendored again at vendor/embit/secp256k1/secp256k1-zkp/. Every spend this device authorises is a discrete-log signature over secp256k1, so Shor applies to the signing path in full. Forward-only rather than retroactive: a signature already published cannot be made more secret, but a public key that has been seen on chain can be attacked the day a CRQC exists, which is why address reuse is the behaviour worth changing before the scheme does."
  - match: {rule: "CODE-QV-ASYMMETRIC", algorithm: "Schnorr (BIP-340)"}
    decision: confirmed
    note: "Correct. Six rows (seven as first published, one of them in a benchmark file): vendor/embit/src/embit/util/secp256k1.py:33 and ctypes_secp256k1.py:287, and the vendored library's own schnorrsig and musig modules. Taproot spends therefore sit in the same class as ECDSA ones: BIP-340 changes the signature's shape, not the hardness assumption it rests on."
  - match: {rule: "CODE-QV-ASYMMETRIC", algorithm: "Pedersen commitment"}
    decision: confirmed
    note: "Correct but narrow, and the narrowness is worth recording so nobody reads this as four more rows of spending exposure. All four are Liquid, not Bitcoin: vendor/embit/src/embit/liquid/pset.py:101 and liquid/transaction.py:90 call secp256k1.pedersen_commit for confidential-transaction value commitments, via util/secp256k1.py:51 and ctypes_secp256k1.py:949. The property at risk is the commitment's *binding*, which rests on the discrete log, so a CRQC could forge a value commitment; the *hiding* property is information-theoretic and no quantum computer touches it. A post-quantum signature standard does not fix this — it needs a different commitment scheme — and it only matters to users who spend Liquid assets."
  - match: {rule: "CODE-QV-ASYMMETRIC", title: "role not determined"}
    decision: confirmed
    note: "Kept rather than dismissed. The rule could not classify the role for five files, and that is honest: the anchor is src/krux/key.py:252-255, where the import of embit.util.secp256k1 and the call to ecdsa_sign_recoverable sit together, so the role is in fact transaction signing and the surrounding rows say so. Left as \"role not determined\" in the report because the classifier's own confidence should not be overwritten by the analyst's reading of the same lines; the decision records the reading instead."
  - match: {rule: "DEP-ADVISORY-DEV"}
    decision: not_applicable
    note: "Correct as a single non-runtime summary, and it is the one thing in this audit that the submodule fix made worse before a second fix made it right. vendor/embit/poetry.lock pins 55 packages and every one of them is `optional = true` behind `markers = 'extra == \"dev\"'`, so embit has no unconditional runtime dependencies at all: the lock file describes how embit is developed and documented, not what it ships. Read by Poetry groups alone they all appeared to be runtime — Poetry 2 files extras under the main group — and this repository briefly reported one critical and sixteen high advisories, eleven of them virtualenv, for a device that runs MicroPython on a K210 and pip-installs nothing. The parser now treats an optional package gated behind a development-shaped extra as non-runtime. Nothing in this group reaches the firmware."
